<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="pageLogin">ورود</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <div class="app">
      <div class="login-container">
        <div class="login-card">
          <div class="login-image">
            <div class="login-image-overlay">
              <div class="login-image-content">
                <h2 data-i18n="shopName">استودیو عکاسی</h2>
                <p data-i18n="loginTitle">ورود به سامانه</p>
              </div>
            </div>
            <img src="./data/login.png" alt="Photography" class="login-image-img" onerror="this.style.display='none'" />
          </div>
          
          <div class="login-form-wrapper">
            <div class="login-top-actions">
              <select id="loginLangSelect" class="lang-select" aria-label="Language">
                <option value="fa">فارسی</option>
                <option value="en">English</option>
              </select>
            </div>
            <div class="login-header">
              <h1 data-i18n="loginTitle">ورود به سامانه</h1>
              <p class="login-subtitle" data-i18n="loginSubtitle"></p>
            </div>

            <form id="loginForm" class="login-form">
              <div class="error" id="loginError" style="display: none"></div>
              
              <label>
                <span data-i18n="username">نام کاربری</span>
                <input id="username" type="text" required autocomplete="username" />
              </label>

              <label>
                <span data-i18n="password">رمز عبور</span>
                <input id="password" type="password" required autocomplete="current-password" />
              </label>

              <button class="btn primary" type="submit" style="width: 100%; margin-top: 8px" data-i18n="loginBtn">Sign In</button>
            </form>

            <div class="login-footer">
              <p class="help" data-i18n="loginDefaultHint"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/i18n.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/login.page.js"></script>
  </body>
</html>
